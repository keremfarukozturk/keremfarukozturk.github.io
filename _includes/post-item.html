{%- assign cat = site.data.categories[include.p.category] -%}
<li class="reveal"><a href="{{ include.p.url | relative_url }}">
  <h3>{{ include.p.title }}</h3>
  <span class="mono">{% if include.show_cat and cat %}<span class="cat">{{ cat.title }}</span>{% endif %}{% include date.html date=include.p.date %}</span>
</a></li>
