{%- comment -%}
  Giriş animasyonunun sahnelerinden türeyen küçük ikonlar.
  Kullanım: {% include icon.html name="yapay-zeka" %}
  .base: soluk taban çizgisi · .draw: üzerinden çizilen bej çizgi (kartlarda döngüde hareket eder)
{%- endcomment -%}
<svg class="icon icon-{{ include.name | default: 'not' }}" viewBox="0 0 48 32" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
{%- case include.name -%}
{%- when "sinyal" -%}
  {%- assign d = "M4 16C8 4 12 4 16 16S24 28 28 16 36 4 40 16 44 22 44 16" -%}
  <path class="base" d="{{ d }}"/><path class="draw" pathLength="100" d="{{ d }}"/>
{%- when "elektronik" -%}
  {%- assign d = "M4 22H11V10H19V22H27V10H35V22H44" -%}
  <path class="base" d="{{ d }}"/><path class="draw" pathLength="100" d="{{ d }}"/>
{%- when "yazilim" -%}
  <rect x="12" y="6" width="24" height="20" rx="5"/>
  <path d="M16 6V3M24 6V3M32 6V3M16 29V26M24 29V26M32 29V26"/>
  <path class="base" d="M21 13L18 16L21 19"/><path class="draw" pathLength="100" d="M21 13L18 16L21 19"/>
  <path class="base" d="M27 13L30 16L27 19"/><path class="draw d2" pathLength="100" d="M27 13L30 16L27 19"/>
{%- when "yapay-zeka" -%}
  {%- assign e1 = "M8 10L24 10M8 22L24 22" -%}{%- assign e2 = "M8 10L24 22M8 22L24 10" -%}{%- assign e3 = "M24 10L40 16M24 22L40 16" -%}
  <path class="base" d="{{ e1 }} {{ e2 }} {{ e3 }}"/>
  <path class="draw" pathLength="100" d="M8 10L24 10"/><path class="draw" pathLength="100" d="M8 22L24 22"/>
  <path class="draw" pathLength="100" d="M8 10L24 22"/><path class="draw" pathLength="100" d="M8 22L24 10"/>
  <path class="draw d2" pathLength="100" d="M24 10L40 16"/><path class="draw d2" pathLength="100" d="M24 22L40 16"/>
  <g class="nodes"><circle class="n1" cx="8" cy="10" r="3"/><circle class="n1" cx="8" cy="22" r="3"/><circle class="n2" cx="24" cy="10" r="3"/><circle class="n2" cx="24" cy="22" r="3"/><circle class="n3" cx="40" cy="16" r="3"/></g>
{%- else -%}
  <path class="base" d="M8 10H40M8 16H40M8 22H28"/>
  <path class="draw" pathLength="100" d="M8 10H40"/><path class="draw d2" pathLength="100" d="M8 16H40"/><path class="draw d3" pathLength="100" d="M8 22H28"/>
{%- endcase -%}
</svg>
