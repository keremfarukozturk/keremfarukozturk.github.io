<!doctype html>
<html lang="{{ page.lang | default: site.lang }}" class="no-js">
<head>
{% include head.html %}
</head>
<body>
{% include header.html %}
<main id="content">
{{ content }}
</main>
{% include footer.html %}
<script src="{{ '/assets/js/motion.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
{%- if page.intro_animation %}
<script src="{{ '/assets/js/intro.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
{%- endif %}
{%- if site.goatcounter and site.goatcounter != "" %}
<script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
{%- endif %}
</body>
</html>
