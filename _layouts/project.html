---
layout: default
---
<article class="article w">
  <div class="meta mono">
    <span class="k">{{ page.year }}</span>
    {%- if page.status %}<span>{{ page.status | capitalize }}</span>{% endif %}
    {%- if page.github %}<a href="{{ page.github }}">GitHub ↗</a>{% endif %}
  </div>
  <h1>{{ page.title }}</h1>
  {%- if page.summary %}<p class="lede">{{ page.summary }}</p>{% endif %}
  <div class="prose">
    {{ content }}
  </div>
</article>
