# ------------------------------------------------------------
# Site ayarları — kişisel bilgiler ve metinler buradan değişir.
# ------------------------------------------------------------
title: Kerem Faruk Öztürk
tagline: "Sinyalden zekâya: her katmanı ciddiye alan bir mühendislik."
description: "Kerem Faruk Öztürk — elektrik-elektronik mühendisliği öğrencisi. Yazılar, projeler ve notlar."
lang: tr
locale: tr_TR
url: "https://keremfarukozturk.github.io"
baseurl: ""

author:
  name: Kerem Faruk Öztürk
  email: keremfozturk@gmail.com

# Ana sayfa
intro: "Elektrik-elektronik mühendisliği öğrencisiyim."
focus: "yapay zekâ donanımı ve sistemleri"   # boş bırakılırsa "Odak" satırı gizlenir

# Bağlantılar — boş bırakılan görünmez
social:
  github: "https://github.com/keremfarukozturk"
  linkedin: ""

# jekyll-seo-tag için
twitter:
  card: summary_large_image

# ------------------------------------------------------------
# İçerik
# ------------------------------------------------------------
collections:
  projects:
    output: true
    permalink: /projeler/:name/

permalink: /yazilar/:title/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: projects }
    values: { layout: project }

# ------------------------------------------------------------
# Derleme (GitHub Pages'in izin verdiği eklentiler)
# ------------------------------------------------------------
theme: null   # hazır tema yok — tüm tasarım bu depoda
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: feed.xml

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - node_modules
