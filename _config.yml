# ------------------------------------------------------------
# Site ayarları — kişisel bilgiler ve metinler buradan değişir.
# ------------------------------------------------------------
title: Kerem Faruk Öztürk
tagline: "AI runs on silicon and is powered by electricity."
description: "Kerem Faruk Öztürk — electrical and electronics engineering student. Projects, experiments and notes on AI hardware, power electronics and AI security."
lang: en            # varsayılan dil; Türkçe sayfalar /tr/ altında
locale: en_US
url: "https://keremfarukozturk.github.io"
baseurl: ""

author:
  name: Kerem Faruk Öztürk
  email: keremfarukozturk@outlook.com

# Bağlantılar — boş bırakılan görünmez
social:
  github: "https://github.com/keremfarukozturk"
  linkedin: "https://www.linkedin.com/in/keremfarukozturk/"
  name: Kerem Faruk Öztürk          # jekyll-seo-tag: arama motorları için kişi bilgisi
  links:
    - "https://github.com/keremfarukozturk"
    - "https://www.linkedin.com/in/keremfarukozturk/"

# Özgeçmiş (PDF). Boş bırakılırsa bağlantı gizlenir.
cv: /assets/kerem-faruk-ozturk-cv.pdf

# Ziyaretçi sayacı (GoatCounter, ücretsiz, çerez kullanmaz).
# goatcounter.com'da hesap açınca seçtiğin kodu buraya yaz (ör. "keremfarukozturk"). Boşken sayaç kapalıdır.
goatcounter: ""

# Google Search Console doğrulaması: Google'ın verdiği "content" değerini yazıp
# aşağıdaki iki satırın başındaki # işaretini kaldır.
# webmaster_verifications:
#   google: "BURAYA-KOD"


# jekyll-seo-tag için
twitter:
  card: summary_large_image

# ------------------------------------------------------------
# İçerik
# ------------------------------------------------------------
collections:
  projects:
    output: true

permalink: pretty   # sayfa adresleri /about/ biçiminde (sonunda .html yok)

# Dil, adres ve paylaşım görseli klasöre göre otomatik atanır:
#   _posts/en, _projects/en  → İngilizce   (/writing/…, /projects/…)
#   _posts/tr, _projects/tr  → Türkçe      (/tr/yazilar/…, /tr/projeler/…)
#   tr/ klasöründeki sayfalar → Türkçe
defaults:
  # Google Search Console doğrulama dosyası — silinmemeli; site haritasına girmez
  - scope: { path: "google3a078c23848147d5.html" }
    values: { sitemap: false }
  - scope: { path: "" }
    values: { lang: en, locale: en_US, image: /assets/og-en.png }
  - scope: { path: "tr" }
    values:
      lang: tr
      locale: tr_TR
      image: /assets/og-tr.png
      description: "Kerem Faruk Öztürk — elektrik-elektronik mühendisliği öğrencisi. Yapay zekâ donanımı, güç elektroniği ve yapay zekâ güvenliği üzerine projeler, deneyler ve notlar."
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "_posts/en", type: posts }
    values: { lang: en, locale: en_US, permalink: "/writing/:title/" }
  - scope: { path: "_posts/tr", type: posts }
    values: { lang: tr, locale: tr_TR, image: /assets/og-tr.png, permalink: "/tr/yazilar/:title/" }
  - scope: { path: "", type: projects }
    values: { layout: project }
  - scope: { path: "_projects/en", type: projects }
    values: { lang: en, locale: en_US, permalink: "/projects/:name/" }
  - scope: { path: "_projects/tr", type: projects }
    values: { lang: tr, locale: tr_TR, image: /assets/og-tr.png, permalink: "/tr/projeler/:name/" }

# ------------------------------------------------------------
# Derleme (GitHub Pages'in izin verdiği eklentiler)
# ------------------------------------------------------------
theme: null   # hazır tema yok — tüm tasarım bu depoda
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from    # eski Türkçe adresleri /tr/ altına yönlendirir

feed:
  path: feed.xml

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - node_modules
